---

- name: download tomcat from tomcat website
  hosts: localhost

  tasks:
    - name: create a directory /opt/tomcat
      file:
        path: /opt/tomcat
        state: directory
        mode: 0755
        owner: root
        group: root

    - name: download tomcat using get url
      get_url:
        url: https://dlcdn.apache.org/tomcat/tomcat-11/v11.0.25/bin/apache-tomcat-11.0.25.tar.gz       
        dest: /opt/tomcat
        mode: 0755
        group: ubuntu
        owner: ubuntu
        
