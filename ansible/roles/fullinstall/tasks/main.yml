---

- name: Install apache2 package
  apt:
    name: apache2
    state: present

- name: Start apache2
  service:
    name: apache2
    state: started

- name: Open port for apache2
  firewalld:
    service: http
    permanent: true
    state: enabled

- name: Restart firewalld
  service:
    name: firewalld
    state: reloaded
